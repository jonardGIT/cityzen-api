title = "xypes-cirs-api gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Allow known CI placeholder secrets in GitHub workflows"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^\.github/workflows/deploy\.yml$''',
  '''^\.github/workflows/security-checks\.yml$''',
]
regexes = [
  '''JWT_SECRET:\s+(?:ci-jwt-secret-0123456789-abcdef-uvwxyz|test-jwt-value-for-ci-builds-only)''',
  '''MFA_ENCRYPTION_KEY:\s+(?:ci-mfa-secret-0123456789-abcdef-uvwxyz|test-mfa-value-for-ci-builds-only)''',
]

[[allowlists]]
description = "Allow documented x-api-key examples in public setup docs"
targetRules = ["curl-auth-header"]
condition = "AND"
regexTarget = "match"
paths = [
  '''^docs/supabase-project-setup\.md$''',
]
regexes = [
  '''(?s)curl -X POST http://localhost:3000/api/v1/auth/(register|login) \\\n+  -H "Content-Type: application/json" \\\n+  -H "x-api-key: xypes-local-dev-api-key"''',
  -H "x-api-key: your-api-key"''',
]

[[allowlists]]
description = "Allow non-production secret placeholders in tests"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''^src/__tests__/security\.test\.ts$''',
  '''^src/__tests__/startupEnv\.test\.ts$''',
  '''^scripts/runJestWithTestDb\.js$''',
]
regexes = [
  '''(?:JWT_SECRET|productionJwtSecret)\s*[:=]\s*['"](?:test-only-jwt-secret-change-me|prod-jwt-secret-0123456789-abcdef-uvwxyz)['"]''',
  '''(?:MFA_ENCRYPTION_KEY|productionMfaEncryptionKey)\s*[:=]\s*['"](?:prod-mfa-secret-0123456789-abcdef-uvwxyz)['"]''',
  '''API_KEYS\s*[:=]\s*['"](?:prod-api-key-0123456789)['"]''',
  '''SUPABASE_ANON_KEY\s*[:=]\s*['"](?:prod-anon-key-0123456789-abcdef-uvwxyz)['"]''',
  '''SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*['"](?:prod-service-role-key-0123456789-abcdef-uvwxyz)['"]''',
]

[[allowlists]]
description = "Ignore local-only temp Gitleaks artifacts during manual runs"
paths = [
  '''^\.tmp-gitleaks-bin/''',
  '''^\.tmp-gitleaks-report\.json$''',
]