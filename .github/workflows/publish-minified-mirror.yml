name: Publish Minified Mirror

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-mirror:
    if: github.repository == 'jonardGIT/cityzen-api'
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: Xypes13/xypes-cityzen-api

    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Assemble bundled minified runtime mirror
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/mirror-commit-message.txt
          STAGE_DIR: ${{ runner.temp }}/minified-mirror
        run: |
          set -e
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/.github/workflows" "$STAGE_DIR/dist" "$STAGE_DIR/prisma"

          cp .gitleaks.toml "$STAGE_DIR/.gitleaks.toml"
          cp ecosystem.config.example.cjs "$STAGE_DIR/ecosystem.config.example.cjs"
          cp package.json "$STAGE_DIR/package.json"
          cp package-lock.json "$STAGE_DIR/package-lock.json"
          cp README.md "$STAGE_DIR/README.md"
          cp prisma/schema.prisma "$STAGE_DIR/prisma/schema.prisma"
          cp .github/workflows/codeql-analysis.yml "$STAGE_DIR/.github/workflows/codeql-analysis.yml"
          cp .github/workflows/security-checks.yml "$STAGE_DIR/.github/workflows/security-checks.yml"
          cp .github/workflows/deploy.yml "$STAGE_DIR/.github/workflows/deploy.yml"

          npx esbuild src/server.ts \
            --bundle \
            --format=esm \
            --minify \
            --outfile="$STAGE_DIR/dist/server.js" \
            --packages=external \
            --platform=node \
            --target=node20

          git log -1 --format=%B "$GITHUB_SHA" > "$COMMIT_MESSAGE_FILE"

      - name: Publish to Xypes13 mirror repository
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/mirror-commit-message.txt
          MIRROR_PUSH_TOKEN: ${{ secrets['XYPES_MIRROR_TOKEN'] }}
          PUBLISH_DIR: ${{ runner.temp }}/mirror-publish
          STAGE_DIR: ${{ runner.temp }}/minified-mirror
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          if [[ -z "$MIRROR_PUSH_TOKEN" ]]; then
            echo "XYPES_MIRROR_TOKEN is required to publish the minified mirror."
            exit 1
          fi

          rm -rf "$PUBLISH_DIR"

          MIRROR_REMOTE="https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/${TARGET_REPO}.git"

          if git ls-remote --exit-code --heads "$MIRROR_REMOTE" "$TARGET_BRANCH" >/dev/null 2>&1; then
            git clone --branch "$TARGET_BRANCH" --single-branch "$MIRROR_REMOTE" "$PUBLISH_DIR"
          else
            git clone "$MIRROR_REMOTE" "$PUBLISH_DIR"
            cd "$PUBLISH_DIR"
            git checkout --orphan "$TARGET_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rsync -a --delete --exclude '.git/' "$STAGE_DIR/" "$PUBLISH_DIR/"

          cd "$PUBLISH_DIR"
          git config user.name "Xypes13"
          git config user.email "tech@xypes.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No mirror changes to publish."
            exit 0
          fi

          git commit -F "$COMMIT_MESSAGE_FILE"
          git push origin "$TARGET_BRANCH"
