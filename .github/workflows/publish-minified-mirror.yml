name: Publish Minified Mirror

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-mirror:
    if: github.repository == 'jonardGIT/cityzen-api'
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: Xypes13/xypes-cityzen-api

    steps:
      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Assemble bundled minified runtime mirror
        env:
          STAGE_DIR: ${{ runner.temp }}/minified-mirror
        run: |
          set -e
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/dist" "$STAGE_DIR/prisma"

          cp package.json "$STAGE_DIR/package.json"
          cp package-lock.json "$STAGE_DIR/package-lock.json"
          cp README.md "$STAGE_DIR/README.md"
          cp prisma/schema.prisma "$STAGE_DIR/prisma/schema.prisma"

          npx esbuild src/server.ts \
            --bundle \
            --format=esm \
            --minify \
            --outfile="$STAGE_DIR/dist/server.js" \
            --packages=external \
            --platform=node \
            --target=node20

          git log -1 --format=%B "$GITHUB_SHA" > "$STAGE_DIR/.commit-message"
          git log -1 --format=%an "$GITHUB_SHA" > "$STAGE_DIR/.commit-author-name"
          git log -1 --format=%ae "$GITHUB_SHA" > "$STAGE_DIR/.commit-author-email"

      - name: Publish to Xypes13 mirror repository
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets['XYPES_MIRROR_TOKEN'] }}
          STAGE_DIR: ${{ runner.temp }}/minified-mirror
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -e

          if [[ -z "$MIRROR_PUSH_TOKEN" ]]; then
            echo "XYPES_MIRROR_TOKEN is required to publish the minified mirror."
            exit 1
          fi

          cd "$STAGE_DIR"
          git init
          git checkout -b "$TARGET_BRANCH"
          git config user.name "$(cat .commit-author-name)"
          git config user.email "$(cat .commit-author-email)"
          git add -A

          if git diff --cached --quiet; then
            echo "No mirror changes to publish."
            exit 0
          fi

          git commit -F .commit-message
          git remote add origin "https://x-access-token:${MIRROR_PUSH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force origin "$TARGET_BRANCH"
