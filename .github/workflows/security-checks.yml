name: Security Checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Explain current dependency review mode
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ] || [ "${{ vars.ENABLE_GITHUB_DEPENDENCY_REVIEW }}" = "true" ]; then
            echo "Dependency review is enabled for this run."
          else
            echo "Dependency review is disabled for this private repository. Enable Dependency Graph and GitHub Advanced Security, then set ENABLE_GITHUB_DEPENDENCY_REVIEW=true to turn it back on."
          fi

      - name: Checkout repository
        if: github.event.repository.private == false || vars.ENABLE_GITHUB_DEPENDENCY_REVIEW == 'true'
        uses: actions/checkout@v4

      - name: Review dependency changes
        if: github.event.repository.private == false || vars.ENABLE_GITHUB_DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@v4

  build-and-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xypes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xypes_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      JWT_SECRET: ci-jwt-secret-0123456789-abcdef-uvwxyz
      MFA_ENCRYPTION_KEY: ci-mfa-secret-0123456789-abcdef-uvwxyz
      TRUST_PROXY: false
      FEATURE_AUTH_PROVIDER: local
      FEATURE_TOKEN_MODE: app-jwt
      FEATURE_MFA_MODE: local-totp
      FEATURE_MEDIA_STORAGE: supabase-storage
      FEATURE_RECORD_DELETION: archive
      FEATURE_PROFILE_NAME: ci-security-profile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Initialize CI database schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d xypes_test -f prisma/reset-prisma-schema.sql

      - name: Seed CI database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d xypes_test -f prisma/seed-data.sql

      - name: Build TypeScript
        run: npm run build

      - name: Build locked production profile
        run: npm run build:production

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
