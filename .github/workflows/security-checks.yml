name: Security Checks

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    if: (github.repository == 'Xypes13/xypes-cityzen-api' || github.repository == 'jonardGIT/cityzen-api') && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Explain current dependency review mode
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ] || [ "${{ vars.ENABLE_GITHUB_DEPENDENCY_REVIEW }}" = "true" ]; then
            echo "Dependency review is enabled for this run."
          else
            echo "Dependency review is disabled for this private repository. Enable Dependency Graph and GitHub Advanced Security, then set ENABLE_GITHUB_DEPENDENCY_REVIEW=true to turn it back on."
          fi

      - name: Checkout repository
        if: github.event.repository.private == false || vars.ENABLE_GITHUB_DEPENDENCY_REVIEW == 'true'
        uses: actions/checkout@v4

      - name: Review dependency changes
        if: github.event.repository.private == false || vars.ENABLE_GITHUB_DEPENDENCY_REVIEW == 'true'
        uses: actions/dependency-review-action@v4

  source-tests:
    if: github.repository == 'jonardGIT/cityzen-api'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xypes_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xypes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run source test suite
        run: npm test

  build-and-audit:
    if: github.repository == 'Xypes13/xypes-cityzen-api' || github.repository == 'jonardGIT/cityzen-api'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Build source project
        if: github.repository == 'jonardGIT/cityzen-api'
        run: npm run build

      - name: Verify bundled runtime exists
        if: github.repository == 'Xypes13/xypes-cityzen-api'
        run: test -f dist/server.js

      - name: Check bundled runtime syntax
        if: github.repository == 'Xypes13/xypes-cityzen-api'
        run: node --check dist/server.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    if: github.repository == 'Xypes13/xypes-cityzen-api' || github.repository == 'jonardGIT/cityzen-api'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Gitleaks
        run: |
          set -e
          version=8.24.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run Gitleaks on current tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact
