name: Deploy to Droplet

on:
  push:
    branches:
      - main # change if your deploy branch is different

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xypes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xypes_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      JWT_SECRET: ci-jwt-secret-0123456789-abcdef-uvwxyz
      MFA_ENCRYPTION_KEY: ci-mfa-secret-0123456789-abcdef-uvwxyz
      API_KEYS: ci-api-key-0123456789
      TRUST_PROXY: false
      FEATURE_AUTH_PROVIDER: local
      FEATURE_TOKEN_MODE: app-jwt
      FEATURE_MFA_MODE: local-totp
      FEATURE_MEDIA_STORAGE: supabase-storage
      FEATURE_RECORD_DELETION: archive
      FEATURE_PROFILE_NAME: deploy-gate
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build locked production profile
        run: npm run build:production

      - name: Run focused pre-deploy security validation
        run: >-
          npm test -- --runTestsByPath
          src/__tests__/featureSelection.test.ts
          src/__tests__/health.test.ts
          src/__tests__/startupEnv.test.ts
          src/__tests__/auth-bootstrap.test.ts
          src/__tests__/users.test.ts
          src/__tests__/security.test.ts
          src/__tests__/incidents.test.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/xypes-cirs-api
            git pull origin main
            npm install
            npm run build
            pm2 restart xype-cirs-api
