name: Deploy to Droplet

on:
  push:
    branches:
      - main # change if your deploy branch is different

jobs:
  verify:
    if: github.repository == 'Xypes13/xypes-cityzen-api'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Verify bundled runtime exists
        run: test -f dist/server.js

      - name: Check bundled runtime syntax
        run: node --check dist/server.js

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  deploy:
    if: github.repository == 'Xypes13/xypes-cityzen-api'
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/xypes-cirs-api
            if [[ ! -f ecosystem.config.cjs ]]; then
              cp ecosystem.config.example.cjs ecosystem.config.cjs
            fi
            git pull --ff-only origin main
            npm ci
            node --check dist/server.js
            pm2 startOrRestart ecosystem.config.cjs --env production
