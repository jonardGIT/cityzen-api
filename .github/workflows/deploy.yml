name: Deploy to Droplet

on:
  push:
    branches:
      - main # change if your deploy branch is different

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xypes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d xypes_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/xypes_test?schema=public
      JWT_SECRET: test-jwt-value-for-ci-builds-only
      MFA_ENCRYPTION_KEY: test-mfa-value-for-ci-builds-only
      API_KEYS: test-client-placeholder
      TRUST_PROXY: false
      FEATURE_AUTH_PROVIDER: local
      FEATURE_TOKEN_MODE: app-jwt
      FEATURE_MFA_MODE: local-totp
      FEATURE_MEDIA_STORAGE: supabase-storage
      FEATURE_RECORD_DELETION: archive
      FEATURE_PROFILE_NAME: deploy-gate
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build TypeScript
        run: npm run build

      - name: Build locked production profile
        run: npm run build:production

      - name: Run focused pre-deploy security validation
        run: >-
          npm test -- --runTestsByPath
          src/__tests__/featureSelection.test.ts
          src/__tests__/health.test.ts
          src/__tests__/startupEnv.test.ts
          src/__tests__/auth-bootstrap.test.ts
          src/__tests__/users.test.ts
          src/__tests__/security.test.ts
          src/__tests__/incidents.test.ts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/xypes-cirs-api
            test -f ecosystem.config.cjs
            git pull --ff-only origin main
            npm ci
            node <<'NODE'
            const { spawnSync } = require('node:child_process');
            const ecosystem = require('./ecosystem.config.cjs');
            const app = ecosystem.apps.find((entry) => entry.name === 'xypes-cirs-api');

            if (!app) {
              throw new Error('xypes-cirs-api app config not found in ecosystem.config.cjs');
            }

            const env = { ...process.env, ...(app.env || {}), ...(app.env_production || {}) };
            const result = spawnSync('npm', ['run', 'build:production'], {
              cwd: process.cwd(),
              env,
              stdio: 'inherit',
            });

            process.exit(result.status ?? 1);
            NODE
            pm2 startOrRestart ecosystem.config.cjs --env production
